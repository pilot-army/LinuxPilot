services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
      - tooling
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  auth-migrate:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      COREPACK_ENABLE_NETWORK: '0'
    command: ['/app/services/auth-service/node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    user: '10001:10001'
    environment:
      NODE_ENV: production
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JWT_ACCESS_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_ACCESS_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-linuxpilot-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-linuxpilot-gateway}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-19456}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
    volumes:
      - ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - backend

  server-migrate:
    build:
      context: .
      dockerfile: services/server-service/Dockerfile
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/linuxpilot_servers
      COREPACK_ENABLE_NETWORK: '0'
    command: ['/app/services/server-service/node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  server-service:
    build:
      context: .
      dockerfile: services/server-service/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    user: '10001:10001'
    environment:
      NODE_ENV: production
      SERVER_SERVICE_HOST: 0.0.0.0
      SERVER_SERVICE_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/linuxpilot_servers
      JWT_ACCESS_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-linuxpilot-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-linuxpilot-gateway}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-30000}
      OFFLINE_TIMEOUT_MS: ${OFFLINE_TIMEOUT_MS:-90000}
      ENROLLMENT_TOKEN_TTL_MS: ${ENROLLMENT_TOKEN_TTL_MS:-900000}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-14}
      METRICS_CLEANUP_INTERVAL_MS: ${METRICS_CLEANUP_INTERVAL_MS:-900000}
      METRICS_CLEANUP_BATCH_SIZE: ${METRICS_CLEANUP_BATCH_SIZE:-500}
      STATUS_SWEEP_INTERVAL_MS: ${STATUS_SWEEP_INTERVAL_MS:-30000}
      AGENT_TIMESTAMP_WINDOW_MS: ${AGENT_TIMESTAMP_WINDOW_MS:-30000}
      AGENT_REQUEST_BODY_LIMIT: ${AGENT_REQUEST_BODY_LIMIT:-32768}
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8080}
      SSH_KEYS_MASTER_KEY: ${SSH_KEYS_MASTER_KEY:?SSH_KEYS_MASTER_KEY is required}
      SSH_KEYS_MASTER_KEY_VERSION: ${SSH_KEYS_MASTER_KEY_VERSION:-v1}
    volumes:
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      server-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - backend

  api-gateway:
    build:
      context: .
      dockerfile: gateway/api-gateway/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    user: '10001:10001'
    environment:
      NODE_ENV: production
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_SERVICE_TIMEOUT_MS: ${AUTH_SERVICE_TIMEOUT_MS:-5000}
      SERVER_SERVICE_URL: http://server-service:3002
      SERVER_SERVICE_TIMEOUT_MS: ${SERVER_SERVICE_TIMEOUT_MS:-5000}
      AGENT_RATE_LIMIT: ${AGENT_RATE_LIMIT:-30}
      AGENT_RATE_LIMIT_TTL_MS: ${AGENT_RATE_LIMIT_TTL_MS:-60000}
      AGENT_REQUEST_BODY_LIMIT: ${AGENT_REQUEST_BODY_LIMIT:-32768}
      JWT_ACCESS_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-linuxpilot-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-linuxpilot-gateway}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE must be set explicitly}
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY must be set explicitly}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_LIMIT_TTL_MS: ${LOGIN_RATE_LIMIT_TTL_MS:-60000}
      REFRESH_RATE_LIMIT: ${REFRESH_RATE_LIMIT:-10}
      REFRESH_RATE_LIMIT_TTL_MS: ${REFRESH_RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_STORE: memory
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      auth-service:
        condition: service_healthy
      server-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - public
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'
    networks:
      - public

networks:
  public:
  backend:
    internal: true
  tooling:

volumes:
  postgres_data:
