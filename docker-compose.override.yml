# Local development overlay. Docker Compose loads this file automatically.
# `localhost:8080` serves Vite with hot reload instead of the static nginx image.
# Production-like UI: docker compose -f docker-compose.yml up -d --build web
services:
  auth-migrate:
    environment:
      NODE_ENV: development

  auth-service:
    environment:
      NODE_ENV: development

  server-migrate:
    environment:
      NODE_ENV: development

  server-service:
    environment:
      NODE_ENV: development

  api-gateway:
    environment:
      NODE_ENV: development
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: 'true'
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-8080}
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      VITE_DEV_PORT: 80
      VITE_HMR_CLIENT_PORT: ${WEB_PORT:-8080}
      VITE_USE_POLLING: '1'
      VITE_API_PROXY: http://api-gateway:3000
    volumes:
      - type: bind
        source: ./apps/web/src
        target: /app/apps/web/src
        consistency: consistent
      - type: bind
        source: ./apps/web/index.html
        target: /app/apps/web/index.html
        consistency: consistent
      - type: bind
        source: ./apps/web/vite.config.ts
        target: /app/apps/web/vite.config.ts
        consistency: consistent
      # Vite aliases these packages to source. Without live mounts, a rebuilt
      # web image keeps stale contracts and a new named export crashes the SPA.
      - type: bind
        source: ./packages/i18n/src
        target: /app/packages/i18n/src
        consistency: consistent
      - type: bind
        source: ./packages/common/src
        target: /app/packages/common/src
        consistency: consistent
      - type: bind
        source: ./packages/auth-contracts/src
        target: /app/packages/auth-contracts/src
        consistency: consistent
      - type: bind
        source: ./packages/server-contracts/src
        target: /app/packages/server-contracts/src
        consistency: consistent
    command:
      [
        'pnpm',
        '--filter',
        '@linuxpilot/web',
        'exec',
        'vite',
        '--host',
        '0.0.0.0',
        '--port',
        '80',
        '--force',
      ]
